<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>选型台 · 开源能力库</title>
  <meta name="description" content="把需求拆成组件，逐项给出直接使用 / fork / 借鉴 / 自研的结论。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307080a'/%3E%3Crect x='8' y='8' width='7' height='7' rx='1.5' fill='%23f4f4f6'/%3E%3Crect x='17' y='8' width='7' height='7' rx='1.5' fill='%235e6ad2'/%3E%3Crect x='8' y='17' width='7' height='7' rx='1.5' fill='%235e6ad2'/%3E%3Crect x='17' y='17' width='7' height='7' rx='1.5' fill='%23f4f4f6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <rect x="3" y="3" width="7" height="7" rx="1.5" fill="currentColor" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" fill="var(--accent)" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" fill="var(--accent)" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" fill="currentColor" />
          </svg>
        </span>
        <span class="brand-text">
          <strong>选型台</strong>
          <small>开源能力库</small>
        </span>
      </div>

      <nav class="nav" aria-label="主导航">
        <a class="nav-item" href="#/decide" data-route="decide">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4">
            <circle cx="8" cy="8" r="5.6" />
            <path d="M10.4 5.6 8.9 8.9 5.6 10.4 7.1 7.1z" stroke-linejoin="round" />
          </svg>
          <span>选型</span>
        </a>
        <a class="nav-item" href="#/find" data-route="find">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4">
            <circle cx="7.2" cy="7.2" r="4.4" />
            <path d="m10.6 10.6 3 3" stroke-linecap="round" />
          </svg>
          <span>检索</span>
        </a>
        <a class="nav-item" href="#/caps" data-route="caps">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1" />
            <rect x="9" y="2.5" width="4.5" height="4.5" rx="1" />
            <rect x="2.5" y="9" width="4.5" height="4.5" rx="1" />
            <rect x="9" y="9" width="4.5" height="4.5" rx="1" />
          </svg>
          <span>能力库</span>
        </a>
        <a class="nav-item" href="#/settings" data-route="settings">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M2.5 4.5h11M2.5 11.5h11" stroke-linecap="round" />
            <circle cx="6" cy="4.5" r="1.7" fill="var(--surface-1)" />
            <circle cx="10.5" cy="11.5" r="1.7" fill="var(--surface-1)" />
          </svg>
          <span>设置</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="db-stat" id="dbStat">
          <span class="db-dot" aria-hidden="true"></span>
          <span class="db-text">正在读取…</span>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换明暗主题">
          <svg class="icon-moon" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3">
            <path d="M13 9.6A5.4 5.4 0 0 1 6.4 3a5.6 5.6 0 1 0 6.6 6.6Z" stroke-linejoin="round" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3">
            <circle cx="8" cy="8" r="3" />
            <path d="M8 1.5v1.4M8 13.1v1.4M1.5 8h1.4M13.1 8h1.4M3.4 3.4l1 1M11.6 11.6l1 1M12.6 3.4l-1 1M4.4 11.6l-1 1" stroke-linecap="round" />
          </svg>
          <span class="theme-label">暗色</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="page-head">
          <h1 id="pageTitle">选型</h1>
          <p id="pageSub">拆解需求，逐项比对，给出可执行的结论。</p>
        </div>
        <div class="topbar-actions">
          <span class="chip" id="llmChip">模型状态读取中…</span>
        </div>
      </header>
      <div class="update-bar" id="updateBar" hidden></div>
      <div class="content" id="content" aria-live="polite"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
